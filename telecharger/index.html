<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Téléchargeur MP4</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0e;
      --text: #f4f3ef;
      --muted: rgba(244, 243, 239, 0.66);
      --amber: #ffc93c;
      --amber-2: #ff9a1f;
      --glass-bg: linear-gradient(140deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03) 60%);
      --glass-border: rgba(255, 255, 255, 0.12);
      --error: #ff6b6b;
      --ok: #6be3a4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: radial-gradient(circle at 20% 0%, rgba(255,176,40,0.18), transparent 50%), var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .carte {
      width: 100%;
      max-width: 560px;
      padding: 32px;
      border-radius: 28px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(22px) saturate(170%);
      box-shadow: 0 24px 60px -20px rgba(0,0,0,0.6);
    }
    h1 {
      margin: 0 0 8px;
      font-family: "Sora", sans-serif;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
    }
    h1 span { color: var(--amber); }
    p.intro { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(0,0,0,0.35);
      color: var(--text);
      font: inherit;
    }
    input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
    button {
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--amber), var(--amber-2));
      color: #1a1205;
      font: 600 1rem "Inter", sans-serif;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .statut { min-height: 1.4em; margin: 16px 0 0; font-size: 0.95rem; }
    .statut.erreur { color: var(--error); }
    .statut.ok { color: var(--ok); }
    .note { margin: 24px 0 0; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <main class="carte">
    <h1>Téléchargeur <span>MP4</span></h1>
    <p class="intro">Colle le lien d'une vidéo MP4 et récupère-la directement sur ton appareil.</p>

    <form id="formulaire">
      <input id="lien" type="url" placeholder="https://exemple.com/video.mp4" required autocomplete="off">
      <button id="bouton" type="submit">Télécharger</button>
    </form>
    <p id="statut" class="statut" role="status"></p>

    <p class="note">Fonctionne avec les liens directs vers un fichier .mp4. Les plateformes de streaming
      (YouTube, Netflix…) ne sont pas prises en charge. Ne télécharge que des vidéos dont tu as le droit.</p>
  </main>

  <script>
    const formulaire = document.getElementById('formulaire');
    const lien = document.getElementById('lien');
    const bouton = document.getElementById('bouton');
    const statut = document.getElementById('statut');

    function afficher(message, classe = '') {
      statut.textContent = message;
      statut.className = 'statut ' + classe;
    }

    function taille(octets) {
      if (!octets) return '';
      const unites = ['o', 'Ko', 'Mo', 'Go'];
      let i = 0;
      while (octets >= 1024 && i < unites.length - 1) { octets /= 1024; i++; }
      return ' (' + octets.toFixed(i ? 1 : 0) + ' ' + unites[i] + ')';
    }

    formulaire.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = lien.value.trim();
      bouton.disabled = true;
      afficher('Vérification du lien…');

      try {
        const rep = await fetch('telecharger.php?verifier=1&url=' + encodeURIComponent(url));
        const infos = await rep.json();
        if (!infos.ok) throw new Error(infos.message);

        afficher('Téléchargement de « ' + infos.nom + ' »' + taille(infos.taille) + ' lancé.', 'ok');
        const a = document.createElement('a');
        a.href = 'telecharger.php?url=' + encodeURIComponent(url);
        a.download = infos.nom;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        afficher(err.message || 'Une erreur est survenue.', 'erreur');
      } finally {
        bouton.disabled = false;
      }
    });
  </script>
</body>
</html>
